exercise: squat
view: side

phases:
  up_angle: 155          # knee angle above this means lockout/standing
  bottom_angle: 112      # knee angle below this means bottom candidate
  ascent_hysteresis: 8

metrics:
  depth_min_ratio: -0.015       # hip_y - knee_y normalized by body height; larger means deeper
  torso_lean_max_deg: 45
  hip_shift_ratio_max: 0.10
  hip_rise_torso_delta_deg: 7
  hip_rise_knee_angle_max: 135

faults:
  depth_not_enough:
    phase: ascent
    severity: medium
    message: "深蹲深度不够，继续下到髋部接近或低于膝盖。"

  torso_lean_too_much:
    phase: descent|bottom|ascent
    severity: medium
    message: "身体前倾过多，保持胸部稳定。"

  hip_rise_too_early:
    phase: ascent
    severity: high
    message: "上升时髋部先起，保持胸部和髋部同步上升。"

  pose_low_confidence:
    phase: any
    severity: low
    message: "人体关键点不稳定，请调整手机角度或光线。"
